<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アカウント登録 | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container auth-container">
    <h1>アカウント登録</h1>
    <form class="auth-form" th:action="@{/register}" th:object="${registration}" method="post">
        <label for="username">ユーザー名（半角英数字・_、3〜50文字）</label>
        <input class="form-input" id="username" th:field="*{username}" autocomplete="username" minlength="3" maxlength="50" required>
        <p role="alert" th:errors="*{username}"></p>
        <label for="password">パスワード（8文字以上、UTF-8で72バイト以内）</label>
        <input class="form-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <p role="alert" th:errors="*{password}"></p>
        <button class="btn" type="submit">登録</button>
    </form>
    <p><a th:href="@{/login}">ログイン画面へ</a></p>
</main>
</body>
</html>
