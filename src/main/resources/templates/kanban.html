<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>カンバンボード</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/kanban.css}">
    <script th:src="@{/js/kanban.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/account :: account}"></div>
<main class="container kanban-container">
    <header class="list-header">
        <div class="page-heading"><h1 class="page-title">カンバンボード</h1><img class="title-image" src="/images/todo-kanban.png" alt="" width="88" height="72"></div>
        <nav class="list-actions" aria-label="画面の操作">
            <a class="btn sub" th:href="@{/todos}">一覧で見る</a>
            <a class="btn sub" th:href="@{/calendar}">カレンダーで見る</a>
            <a class="btn" th:href="@{/todos/new}">新規登録</a>
        </nav>
    </header>
    <p>カードをドラッグするか、ステータスを選択して移動できます。</p>
    <p id="kanban-error" class="quick-todo-error" role="alert" hidden></p>
    <p id="kanban-message" role="status" aria-live="polite"></p>
    <div id="kanban-board" class="kanban-board">
        <section class="kanban-column" th:each="status : ${statuses}" th:attr="data-status=${status}">
            <h2 th:text="${status.name() == 'NOT_STARTED' ? '未着手' : (status.name() == 'IN_PROGRESS' ? '進行中' : '完了')}"></h2>
            <div class="kanban-cards">
                <article class="kanban-card" draggable="true" th:each="todo : ${todos}" th:if="${todo.status == status}"
                         th:attr="data-id=${todo.id},data-status=${status},data-url=@{/api/todos/{id}/status(id=${todo.id})}">
                    <h3><a draggable="false" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:text="${todo.title}"></a></h3>
                    <p th:if="${todo.detail}" th:text="${todo.detail}"></p>
                    <p th:text="${todo.category}"></p>
                    <p th:if="${todo.deadline}" th:text="|期限: ${todo.deadline}|"></p>
                    <label>ステータス
                        <select class="kanban-status">
                            <option value="NOT_STARTED" th:selected="${status.name() == 'NOT_STARTED'}">未着手</option>
                            <option value="IN_PROGRESS" th:selected="${status.name() == 'IN_PROGRESS'}">進行中</option>
                            <option value="DONE" th:selected="${status.name() == 'DONE'}">完了</option>
                        </select>
                    </label>
                </article>
            </div>
        </section>
    </div>
</main>
</body>
</html>
