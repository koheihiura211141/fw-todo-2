<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>やることの削除確認</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-5" th:href="@{/css/style.css(v='20261126-5')}">
</head>
<body>
    <div th:replace="~{fragments/account :: account}"></div>
    <main class="container">
        <div class="page-heading"><h1 class="page-title">やることの削除確認</h1><img class="title-image" src="/images/todo-delete.png" alt="" width="88" height="72"></div>
        <p class="confirm-value">やること：<span th:text="${todo.title}"></span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}"></span></p>
        <p class="confirm-value">期限：<span th:text="${todo.deadline != null ? todo.deadline : '（入力なし）'}"></span></p>
        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" href="/todos">やめる</a>
        </div>
    </main>
</body>
</html>
