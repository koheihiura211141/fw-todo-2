<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>やることの削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">やることの削除確認</h1>
        <p class="confirm-value">やること：<span th:text="${todo.title}"></span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}"></span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}"></span></p>
        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" href="/todos">やめる</a>
        </div>
    </main>
</body>
</html>
