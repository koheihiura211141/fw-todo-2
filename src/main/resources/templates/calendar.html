<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='calendar-grid-2')}" href="/css/style.css?v=calendar-grid-2">
</head>
<body>
    <main class="container">
        <h1 class="page-title" id="calendar-title" th:text="|${year}年${month}月|">2026年4月</h1>
        <nav class="calendar-navigation" aria-label="表示する月">
            <a class="link" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue})}">前の月</a>
            <a class="link" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}">次の月</a>
        </nav>
        <table class="calendar-table" aria-labelledby="calendar-title" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th><th scope="col">月</th><th scope="col">火</th><th scope="col">水</th><th scope="col">木</th><th scope="col">金</th><th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="date : ${week}" th:attr="data-date=${date}">
                        <span th:if="${date != null}" th:text="${date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodos() {
            const table = document.querySelector('.calendar-table');
            const params = new URLSearchParams({
                from: table.dataset.from,
                to: table.dataset.to
            });

            try {
                const res = await fetch(`/api/todos?${params}`);
                if (!res.ok) {
                    throw new Error('やることを取得できませんでした。');
                }
                const todos = await res.json();
                const cells = table.querySelectorAll('td[data-date]');

                for (const todo of todos) {
                    for (const cell of cells) {
                        if (todo.dueDate === cell.dataset.date) {
                            const name = document.createElement('div');
                            name.textContent = todo.title;
                            cell.appendChild(name);
                        }
                    }
                }
            } catch (error) {
                console.error('やることの読み込みに失敗しました。', error);
            }
        }

        loadTodos();
    </script>
</body>
</html>
