<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-2" th:href="@{/css/style.css(v='20261126-2')}">
</head>
<body>
    <main class="container">
        <div class="page-heading"><h1 class="page-title">やること一覧</h1><img class="title-image" src="/images/todo-person.png" alt="" width="44" height="44"></div>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <p><a class="btn" href="/todos/new">新規登録</a> <a class="link" href="/calendar">カレンダーで見る</a></p>
        <form class="search-bar" action="/todos" method="get">
            <label for="keyword">やることの名前</label>
            <input class="form-input" id="keyword" type="text" name="keyword" th:value="${keyword}">
            <label for="category">ジャンル</label>
            <select class="form-input" id="category" name="category">
                <option value="" th:selected="${category == ''}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            </select>
            <input type="hidden" name="order" th:value="${order}">
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}">期限が遠い順</a>
        </form>
        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
                    <td th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                </tr>
            </tbody>
        </table>
        <p class="page-summary" th:if="${todoPage.totalElements > 0}"
           th:text="|全${todoPage.totalElements}件中 ${startItem}-${endItem}件|">全50件中 1-10件</p>
        <nav class="pagination" aria-label="ページネーション" th:if="${todoPage.totalPages > 1}">
            <a class="page-link" th:if="${todoPage.hasPrevious()}"
               th:href="@{/todos(page=${todoPage.number - 1},keyword=${keyword},category=${category},order=${order})}">前へ</a>
            <span class="page-link disabled" th:unless="${todoPage.hasPrevious()}">前へ</span>
            <a class="page-link" th:each="pageNumber : ${#numbers.sequence(0, todoPage.totalPages - 1)}"
               th:href="@{/todos(page=${pageNumber},keyword=${keyword},category=${category},order=${order})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == todoPage.number} ? ' active' : ''"
               th:attr="aria-current=${pageNumber == todoPage.number ? 'page' : null}">1</a>
            <a class="page-link" th:if="${todoPage.hasNext()}"
               th:href="@{/todos(page=${todoPage.number + 1},keyword=${keyword},category=${category},order=${order})}">次へ</a>
            <span class="page-link disabled" th:unless="${todoPage.hasNext()}">次へ</span>
        </nav>
    </main>
</body>
</html>
