<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-15" th:href="@{/css/style.css(v='20261126-15')}">
</head>
<body>
    <main class="container">
        <header class="list-header">
            <div class="page-heading"><h1 class="page-title">やること一覧</h1><img class="title-image" src="/images/todo-person.png" alt="" width="88" height="72"></div>
            <nav class="list-actions" aria-label="一覧の操作">
                <a class="btn sub" href="/calendar">カレンダーで見る</a>
                <a class="btn" href="/todos/new">新規登録</a>
            </nav>
        </header>
        <form id="quick-todo-form" class="quick-todo-bar" th:action="@{/api/todo}" method="post" novalidate>
            <label for="quick-todo-title">タスクをクイック追加</label>
            <div class="quick-todo-controls">
                <input id="quick-todo-title" class="form-input" name="title" type="text"
                       placeholder="タイトルを入力してEnter" aria-describedby="quick-todo-error" autocomplete="off">
                <button class="btn" type="submit">追加</button>
            </div>
            <p id="quick-todo-error" class="quick-todo-error" role="alert" hidden></p>
            <span id="quick-todo-status" role="status" aria-live="polite"></span>
        </form>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <form id="list-filters" class="list-filters" action="/todos" method="get" aria-label="やることの検索と並び替え">
            <div class="filter-field filter-keyword">
                <label for="keyword">名前</label>
                <input class="form-input" id="keyword" type="search" name="keyword" placeholder="名前で検索" th:value="${keyword}">
            </div>
            <div class="filter-field">
                <label for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="">すべて</option>
                    <option th:each="genre : ${ {'デザイン', 'マーケティング', 'プログラミング', '資格', '就職活動', 'その他'} }" th:value="${genre}" th:text="${genre}" th:selected="${category == genre}"></option>
                </select>
            </div>
            <div class="filter-field">
                <label for="priority">優先度</label>
                <select class="form-input" id="priority" name="priority">
                    <option value="">すべて</option>
                    <option value="1" th:selected="${priority == 1}">高</option>
                    <option value="2" th:selected="${priority == 2}">中</option>
                    <option value="3" th:selected="${priority == 3}">低</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="completed">状態</label>
                <select class="form-input" id="completed" name="completed">
                    <option value="">すべて</option>
                    <option value="false" th:selected="${completed == false}">未完了</option>
                    <option value="true" th:selected="${completed == true}">完了</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="from">期限（開始）</label>
                <input class="form-input" id="from" aria-label="期限の開始日" type="date" name="from" th:value="${from}">
            </div>
            <div class="filter-field filter-date-end">
                <label for="to">期限（終了）</label>
                <input class="form-input" id="to" aria-label="期限の終了日" type="date" name="to" th:value="${to}">
            </div>
            <input type="hidden" name="sortBy" th:value="${sortBy}"><input type="hidden" name="order" th:value="${order}">
            <button class="btn filter-submit" type="submit">絞り込み</button>
            <a class="link filter-reset" href="/todos" th:if="${keyword != '' or category != '' or priority != null or completed != null or from != null or to != null or order == 'desc' or sortBy != 'deadline'}">条件をクリア</a>
        </form>
        <p id="todo-empty" th:if="${#lists.isEmpty(todos)}">条件に一致するやることがありません。</p>
        <form id="bulk-delete-form" th:action="@{/todos/bulk-delete}" method="post">
            <div class="bulk-actions">
                <button id="bulk-delete-button" class="btn" type="submit" disabled>選択した項目を削除</button>
                <span id="selection-count" role="status">0件選択中</span>
                <span>全選択はこのページの項目が対象です</span>
            </div>
        </form>
        <p id="todo-sort-error" class="quick-todo-error" role="alert" hidden></p>
        <table class="todo-table">
            <thead>
                <tr>
                    <th th:attr="aria-sort=${sortBy == 'title' ? (order == 'asc' ? 'ascending' : 'descending') : 'none'}"><span class="column-heading">やること
                        <a class="column-sort" th:classappend="${sortBy == 'title' ? 'sort-' + order : ''}" th:href="@{/todos(keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},sortBy='title',order=${sortBy == 'title' and order == 'asc' ? 'desc' : 'asc'})}" th:attr="aria-label=|やることを${sortBy == 'title' and order == 'asc' ? '降順' : '昇順'}に並び替え|"><span class="sort-up" aria-hidden="true">▲</span><span class="sort-down" aria-hidden="true">▼</span></a></span></th>
                    <th th:attr="aria-sort=${sortBy == 'category' ? (order == 'asc' ? 'ascending' : 'descending') : 'none'}"><span class="column-heading">ジャンル
                        <a class="column-sort" th:classappend="${sortBy == 'category' ? 'sort-' + order : ''}" th:href="@{/todos(keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},sortBy='category',order=${sortBy == 'category' and order == 'asc' ? 'desc' : 'asc'})}" th:attr="aria-label=|ジャンルを${sortBy == 'category' and order == 'asc' ? '降順' : '昇順'}に並び替え|"><span class="sort-up" aria-hidden="true">▲</span><span class="sort-down" aria-hidden="true">▼</span></a></span></th>
                    <th th:attr="aria-sort=${sortBy == 'priority' ? (order == 'asc' ? 'ascending' : 'descending') : 'none'}"><span class="column-heading">優先度
                        <a class="column-sort" th:classappend="${sortBy == 'priority' ? 'sort-' + order : ''}" th:href="@{/todos(keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},sortBy='priority',order=${sortBy == 'priority' and order == 'asc' ? 'desc' : 'asc'})}" th:attr="aria-label=|優先度を${sortBy == 'priority' and order == 'asc' ? '降順' : '昇順'}に並び替え|"><span class="sort-up" aria-hidden="true">▲</span><span class="sort-down" aria-hidden="true">▼</span></a></span></th>
                    <th th:attr="aria-sort=${sortBy == 'deadline' ? (order == 'asc' ? 'ascending' : 'descending') : 'none'}"><span class="column-heading">期限
                        <a class="column-sort" th:classappend="${sortBy == 'deadline' ? 'sort-' + order : ''}" th:href="@{/todos(keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},sortBy='deadline',order=${sortBy == 'deadline' and order == 'asc' ? 'desc' : 'asc'})}" th:attr="aria-label=|期限を${sortBy == 'deadline' and order == 'asc' ? '降順' : '昇順'}に並び替え|"><span class="sort-up" aria-hidden="true">▲</span><span class="sort-down" aria-hidden="true">▼</span></a></span></th>
                    <th th:attr="aria-sort=${sortBy == 'completed' ? (order == 'asc' ? 'ascending' : 'descending') : 'none'}"><span class="column-heading">状態
                        <a class="column-sort" th:classappend="${sortBy == 'completed' ? 'sort-' + order : ''}" th:href="@{/todos(keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},sortBy='completed',order=${sortBy == 'completed' and order == 'asc' ? 'desc' : 'asc'})}" th:attr="aria-label=|状態を${sortBy == 'completed' and order == 'asc' ? '降順' : '昇順'}に並び替え|"><span class="sort-up" aria-hidden="true">▲</span><span class="sort-down" aria-hidden="true">▼</span></a></span></th>
                    <th class="todo-operations">操作</th>
                    <th class="todo-selection"><label class="select-all-label"><input id="select-all" type="checkbox" th:disabled="${#lists.isEmpty(todos)}"> 全選択</label></th>
                </tr>
            </thead>
            <tbody id="todo-list">
                <tr th:each="todo : ${todos}"
                    th:with="overdue=${todo.deadline != null and todo.deadline.isBefore(today)}, upcoming=${todo.deadline != null and !todo.deadline.isBefore(today) and !todo.deadline.isAfter(warningDate)}"
                    th:classappend="${overdue ? 'deadline-overdue' : (upcoming ? 'deadline-upcoming' : '')}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
                    <td>
                        <span th:text="${todo.deadline != null ? #temporals.format(todo.deadline, 'yyyy/MM/dd') : '（入力なし）'}">期限</span>
                        <span class="deadline-warning" th:if="${overdue}">期限切れ</span>
                        <span class="deadline-warning" th:if="${upcoming}">3日以内</span>
                    </td>
                    <td><button type="button" class="todo-status" th:attr="data-id=${todo.id},data-completed=${todo.completed == true},aria-pressed=${todo.completed == true}"><svg class="completion-mark" viewBox="0 0 32 32" aria-hidden="true"><path pathLength="1" d="M6 17 L13 25 L27 7"/></svg><span class="completion-label" th:text="${todo.completed ? '完了' : '未完了'}">未完了</span></button></td>
                    <td class="todo-operations"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td class="todo-selection"><input class="todo-select" type="checkbox" name="ids" th:value="${todo.id}"
                               form="bulk-delete-form" th:attr="aria-label=|${todo.title}を選択|"></td>
                </tr>
            </tbody>
        </table>
        <p class="page-summary" th:if="${todoPage.totalElements > 0}"
           th:text="|全${todoPage.totalElements}件中 ${startItem}-${endItem}件|">全50件中 1-10件</p>
        <nav class="pagination" aria-label="ページネーション" th:if="${todoPage.totalPages > 1}">
            <a class="page-link" th:if="${todoPage.hasPrevious()}"
               th:href="@{/todos(page=${todoPage.number - 1},keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},order=${order},sortBy=${sortBy})}">前へ</a>
            <span class="page-link disabled" th:unless="${todoPage.hasPrevious()}">前へ</span>
            <a class="page-link" th:each="pageNumber : ${#numbers.sequence(0, todoPage.totalPages - 1)}"
               th:href="@{/todos(page=${pageNumber},keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},order=${order},sortBy=${sortBy})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == todoPage.number} ? ' active' : ''"
               th:attr="aria-current=${pageNumber == todoPage.number ? 'page' : null}">1</a>
            <a class="page-link" th:if="${todoPage.hasNext()}"
               th:href="@{/todos(page=${todoPage.number + 1},keyword=${keyword},category=${category},priority=${priority},completed=${completed},from=${from},to=${to},order=${order},sortBy=${sortBy})}">次へ</a>
            <span class="page-link disabled" th:unless="${todoPage.hasNext()}">次へ</span>
        </nav>
    </main>
    <p id="todo-status-error" class="quick-todo-error" role="alert" hidden></p>
    <script src="/js/todo-sort.js" th:src="@{/js/todo-sort.js}" defer></script>
    <script src="/js/todo-status.js" th:src="@{/js/todo-status.js}" defer></script>
    <script src="/js/todo-selection.js" th:src="@{/js/todo-selection.js}" defer></script>
    <script src="/js/quick-todo.js" th:src="@{/js/quick-todo.js}" defer></script>
</body>
</html>
