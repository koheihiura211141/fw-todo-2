<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container auth-container">
    <h1>ToDoにログイン</h1>
    <p role="alert" th:if="${param.error}">ユーザー名またはパスワードが正しくありません。</p>
    <p role="status" th:if="${param.logout}">ログアウトしました。</p>
    <p role="status" th:if="${param.registered}">登録が完了しました。ログインしてください。</p>
    <form class="auth-form" th:action="@{/login}" method="post">
        <label for="username">ユーザー名</label>
        <input class="form-input" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">パスワード</label>
        <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">ログイン</button>
    </form>
    <p><a th:href="@{/register}">アカウントを作成</a></p>
    <hr>
    <form th:action="@{/guest}" method="post"><button class="btn sub" type="submit">ゲストとして利用</button></form>
    <p>登録なしで利用できます。ToDoはログインユーザー・ゲスト全員で共有され、誰でも追加・編集・削除できます。</p>
</main>
</body>
</html>
