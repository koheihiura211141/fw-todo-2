<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDo登録の確認</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-5" th:href="@{/css/style.css(v='20261126-5')}">
</head>
<body>
    <div th:replace="~{fragments/account :: account}"></div>
    <main class="container">
        <div class="page-heading"><h1 class="page-title">ToDo登録の確認</h1><img class="title-image" src="/images/todo-person.png" alt="" width="88" height="72"></div>
        <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">やること</span></p>
        <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">メモ</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">ジャンル</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}">優先度</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.deadline == null ? '（入力なし）' : todo.deadline}">期限</span></p>
        <div class="confirm-actions">
            <form action="/todos" th:action="@{/todos}" method="post" th:object="${todo}">
                <input type="hidden" name="author" th:value="*{author}">
                <input type="hidden" name="title" th:value="*{title}">
                <input type="hidden" name="detail" th:value="*{detail}">
                <input type="hidden" name="category" th:value="*{category}">
                <input type="hidden" name="priority" th:value="*{priority}">
                <input type="hidden" name="deadline" th:value="*{deadline}">
                <button class="btn" type="submit">登録する</button>
            </form>
            <form action="/todos/new" th:action="@{/todos/new}" method="post" th:object="${todo}">
                <input type="hidden" name="author" th:value="*{author}">
                <input type="hidden" name="title" th:value="*{title}">
                <input type="hidden" name="detail" th:value="*{detail}">
                <input type="hidden" name="category" th:value="*{category}">
                <input type="hidden" name="priority" th:value="*{priority}">
                <input type="hidden" name="deadline" th:value="*{deadline}">
                <button class="btn sub" type="submit">書き直す</button>
            </form>
        </div>
    </main>
</body>
</html>
